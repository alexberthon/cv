{% assign skills = include.data %}
{% if skills %}
<section class="section skills-section">
  <h2 class="section-title"><span class="sh"></span>{{ skills.title }}</h2>
  {% for group in skills.groups %}
  <div class="grp">
    <div class="k"><i></i>{{ group.name }}</div>
    <div class="v">{{ group.items }}</div>
  </div>
  {% endfor %}
</section>
{% endif %}
