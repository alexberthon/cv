{% assign languages = include.data %}
{% if languages %}
<section class="section languages-section">
  <h2 class="section-title"><span class="sh"></span>{{ languages.title }}</h2>
  <ul class="pies">
    {% for language in languages.idioms %}
    <li><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="8" pathLength="100" stroke-dasharray="{{ language.fill | default: 100 }} 100" transform="rotate(-90 16 16)"/></svg>{{ language.idiom }}<small>{{ language.level }}</small></li>
    {% endfor %}
  </ul>
</section>
{% endif %}
