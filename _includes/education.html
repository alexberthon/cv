{% assign education = include.data %}
{% if education %}
<section class="section education-section">
  <h2 class="section-title"><span class="sh"></span>{{ include.title }}</h2>
  {% for graduation in education %}
  <div class="grp">
    <div class="d">{{ graduation.degree }}</div>
    <div class="m">{{ graduation.university }}</div>
    <div class="m">{{ graduation.time }}</div>
  </div>
  {% endfor %}
</section>
{% endif %}
