experiences:
  - role: Fullstack Software Engineer
    time: Since May 2025
    company: Faks
    url: https://faks.co
    location: Paris, FR
    details: |
      B2B platform where pharmaceutical labs run commercial deals with pharmacies. Shipping features across backend, web and mobile.

      - **AI invoice auditing:** supplier invoices are parsed by an LLM, then matched against the pharmacy's actual orders to catch overbilling. Heavily refactored the matching engine and built a regression suite replaying human-validated results to catch quality drift
      - **Partner integrations:** synced deals from lab partner portals that have no public API, using backend adapters and a TypeScript Chrome extension
      - **Payments:** integrated a second payment provider alongside the existing one. Rolling out to 20 labs this quarter
      - **Automated invoicing:** built invoice generation end-to-end: PDFs, email delivery, exports, on web and mobile
      - **Reliability:** API idempotency keys on web and mobile, eliminating duplicate submissions from double-clicks and retries
      - **Close to users:** pharmacy support and API-integration meetings with labs. On-call rotation

  - role: Founder/Developer
    time: Since June 2023
    company: TrainStory
    url: https://trainstory.eu
    location: Paris, FR
    details: |
      Trip planner for rail journeys through Europe.

      - Route search: custom A*-based algorithm finding multi-leg rail journeys
      - Solo build: product, design and code, self-hosted on a bare-metal Linux server I maintain and monitor

  - role: Chief Product Officer
    time: May 2018 - February 2023
    company: Calizy
    url: https://calizy.com
    location: London, UK & Paris, FR
    details: |
      Led product for 2 iOS/Android/web apps with a team of 3 developers across Europe: Coorganiz, a B2C app for organizing small communities, and Calizy, a B2B appointment-booking SaaS.

      - Several thousand end users and a dozen B2B clients
      - Turned client needs into roadmap, specs and QA
      - Built the Calizy landing page (Next.js) and internal tooling scripts

