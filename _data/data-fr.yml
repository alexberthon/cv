experiences:
  - role: Fullstack Software Engineer
    time: Depuis Mai 2025
    company: Faks
    url: https://faks.co
    location: Paris, FR
    details: |
      Plateforme B2B où les laboratoires pharmaceutiques mènent des opérations commerciales avec les pharmacies. Je livre des fonctionnalités sur le backend, le web et le mobile.

      - **Audit de factures par IA :** les factures fournisseurs sont lues par un LLM, puis rapprochées des commandes réelles de la pharmacie pour détecter la surfacturation. Refonte en profondeur du moteur de rapprochement, et suite de non-régression rejouant les résultats validés par des humains pour détecter les dérives
      - **Intégrations partenaires :** synchronisation des opérations depuis des portails de labos partenaires sans API publique, via des adaptateurs backend et une extension Chrome en TypeScript
      - **Paiements :** intégration d'un second prestataire de paiement en parallèle de l'existant. Déploiement auprès de 20 labos ce trimestre
      - **Facturation automatisée :** génération de factures de bout en bout : PDF, envoi par email, exports, sur web et mobile
      - **Fiabilité :** clés d'idempotence sur les appels API web et mobile, supprimant les doublons dus aux doubles clics et aux relances. Traçage New Relic, migration vers Rails 8
      - **Proche des utilisateurs :** support aux pharmacies et réunions d'intégration API avec les labos. Astreintes

  - role: Fondateur/Développeur
    time: Depuis Juin 2023
    company: TrainStory
    url: https://trainstory.eu
    location: Paris, FR
    details: |
      Planificateur de voyages en train à travers l'Europe.

      - Recherche d'itinéraires : algorithme maison (A*) de trajets ferroviaires multi-étapes
      - Développé seul : produit, design et code, auto-hébergé sur un serveur Linux bare-metal que je maintiens et supervise

  - role: Chief Product Officer
    time: Mai 2018 - Février 2023
    company: Coorganiz/Calizy
    location: Londres, UK & Paris, FR
    details: |
      Responsable produit de 2 applications iOS/Android/web, avec une équipe de 3 développeurs répartie en Europe : <a href="https://coorganiz.com" target="_blank" rel="nofollow">Coorganiz</a>, une app B2C pour organiser de petites communautés, et <a href="https://calizy.com" target="_blank" rel="nofollow">Calizy</a>, un SaaS B2B de prise de RDV en ligne.

      - Plusieurs milliers d'utilisateurs finaux et une dizaine de clients B2B
      - Traduction des besoins clients en roadmap, spécifications et QA
      - Développement du site vitrine de Calizy (Next.js) et de scripts d'outillage interne

